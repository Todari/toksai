name: Deploy Server (EC2)

# GitHub Actions에서 이미지를 빌드해 GHCR에 올리고, todari-consolidated EC2는
# ~/toksai/docker-compose.prod.yml을 갱신한 뒤 이미지만 pull한다.
on:
  push:
    branches: [main]
    paths:
      - "apps/server/**"
      - "packages/**"
      - "docker-compose.prod.yml"
      - "apps/server/Dockerfile"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-server-production
  cancel-in-progress: false

env:
  SERVER_IMAGE: ghcr.io/todari/toksai-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:${{ github.sha }}
            ${{ env.SERVER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload production compose file
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.prod.yml
          target: ~/toksai
          overwrite: true

      - name: Deploy exact image via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          TOKSAI_SERVER_IMAGE: ${{ env.SERVER_IMAGE }}:${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          envs: GHCR_TOKEN,GHCR_USER,TOKSAI_SERVER_IMAGE
          script: |
            set -eu
            cd ~/toksai

            if [ ! -f .env.production ]; then
              echo "ERROR: ~/toksai/.env.production is missing."
              exit 1
            fi

            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            TOKSAI_SERVER_IMAGE="$TOKSAI_SERVER_IMAGE" \
              docker compose -f docker-compose.prod.yml --env-file .env.production pull server
            TOKSAI_SERVER_IMAGE="$TOKSAI_SERVER_IMAGE" \
              docker compose -f docker-compose.prod.yml --env-file .env.production \
              up -d --no-build --remove-orphans

            healthy=false
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:4100/health >/dev/null; then
                healthy=true
                break
              fi
              sleep 2
            done
            if [ "$healthy" != true ]; then
              TOKSAI_SERVER_IMAGE="$TOKSAI_SERVER_IMAGE" \
                docker compose -f docker-compose.prod.yml --env-file .env.production logs --tail=120 server
              exit 1
            fi

            docker image prune -f
            TOKSAI_SERVER_IMAGE="$TOKSAI_SERVER_IMAGE" \
              docker compose -f docker-compose.prod.yml --env-file .env.production ps
